[platformio]
default_envs = waveshare_esp32_c6_touch_amoled_1_64

[env]
platform = espressif32@6.12.0
framework = espidf
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  -I include
  -std=gnu++17
build_unflags =
  -std=gnu++11

[env:waveshare_esp32_c6_touch_amoled_1_64]
board = esp32-c6-devkitc-1
build_flags =
  ${env.build_flags}
  -D AGENTPING_TARGET_WAVESHARE_ESP32_C6_TOUCH_AMOLED_1_64=1

[env:character_usb]
board_build.partitions = partitions-character.csv
extends = env:waveshare_esp32_c6_touch_amoled_1_64
build_flags =
  ${env:waveshare_esp32_c6_touch_amoled_1_64.build_flags}
  -D AGENTPING_CHARACTER_DEMO=1
upload_port = COM5
monitor_port = COM5

[env:live3d_usb_s3]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -D AGENTPING_TARGET_WAVESHARE_ESP32_S3_LCD_1_47B=1
  -D AGENTPING_LIVE3D=1

[env:live3d_usb]
extends = env:waveshare_esp32_c6_touch_amoled_1_64
build_flags =
  ${env:waveshare_esp32_c6_touch_amoled_1_64.build_flags}
  -D AGENTPING_LIVE3D=1
upload_port = COM5
monitor_port = COM5
