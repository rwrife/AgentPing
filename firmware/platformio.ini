[platformio]
default_envs = waveshare_esp32_c6_touch_amoled_1_64

[env:waveshare_esp32_c6_touch_amoled_1_64]
platform = espressif32@6.12.0
board = esp32-c6-devkitc-1
framework = espidf
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags =
  -D AGENTPING_TARGET_WAVESHARE_ESP32_C6_TOUCH_AMOLED_1_64=1
