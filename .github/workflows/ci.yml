name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol contract and fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: protocol/requirements-ci.txt
      - run: python3 -m pip install --requirement protocol/requirements-ci.txt
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 protocol/validate.py

  bridge:
    name: Bridge build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.300
      - run: dotnet restore AgentPing.sln --locked-mode
      - run: dotnet build AgentPing.sln --configuration Release --no-restore
      - run: dotnet test AgentPing.sln --configuration Release --no-build --logger "console;verbosity=normal"
      - run: ./integration/smoke-bridge.sh
      - run: ./integration/smoke-provider-adapters.sh

  firmware:
    name: ESP32-C6 firmware build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: firmware/requirements-ci.txt
      - run: python3 -m pip install --requirement firmware/requirements-ci.txt
      - run: firmware/tests/run_host_tests.sh
      - run: platformio run -d firmware

  bridge-container:
    name: Bridge container build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --file bridge/AgentPing.Bridge/Dockerfile --tag agentping-bridge:ci .
