name: Windows companion artifacts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  companion:
    name: Companion (${{ matrix.rid }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.300
      - run: dotnet restore AgentPing.sln --locked-mode
      - run: dotnet restore companion/AgentPing.Companion.Windows/AgentPing.Companion.Windows.csproj --locked-mode
      - run: dotnet restore bridge/AgentPing.Bridge/AgentPing.Bridge.csproj --locked-mode
      - run: dotnet test AgentPing.sln --configuration Release --no-restore
      - run: dotnet publish companion/AgentPing.Companion.Windows/AgentPing.Companion.Windows.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore --output artifacts/${{ matrix.rid }}/app
      - run: dotnet publish bridge/AgentPing.Bridge/AgentPing.Bridge.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore --output artifacts/${{ matrix.rid }}/app/bridge
      - run: Copy-Item docs/windows-troubleshooting.md artifacts/${{ matrix.rid }}/app/docs/windows-troubleshooting.md -Force
      - run: dotnet tool install --tool-path .tools wix --version 6.0.2
      - run: .tools/wix build companion/installer/AgentPing.wxs -arch ${{ matrix.rid == 'win-arm64' && 'arm64' || 'x64' }} -d PublishDir=artifacts/${{ matrix.rid }}/app -o artifacts/${{ matrix.rid }}/AgentPing-${{ matrix.rid }}-unsigned.msi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentping-companion-${{ matrix.rid }}-unsigned
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
