name: MVP release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version label for artifact packaging (for example v0.1.0-rc1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-linux:
    name: Verify and stage linux inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: |
            firmware/requirements-ci.txt
            protocol/requirements-ci.txt
      - run: python3 -m pip install --requirement firmware/requirements-ci.txt --requirement protocol/requirements-ci.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.300
      - name: Canonical verification gates
        run: ./scripts/verify.sh
      - name: Protocol generated docs must be current
        run: python3 protocol/generate_reference.py --check
      - name: Bridge container build
        run: docker build --file bridge/AgentPing.Bridge/Dockerfile --tag agentping-bridge:release .
      - name: Generate dependency/license inventories
        run: |
          mkdir -p artifacts/release-inputs/licenses
          dotnet tool install --tool-path .tools dotnet-project-licenses
          .tools/dotnet-project-licenses \
            --input AgentPing.sln \
            --include-transitive \
            --json \
            --outfile artifacts/release-inputs/licenses/licenses-dotnet.json \
            --unique
          python3 -m pip install pip-licenses
          pip-licenses --format=json --with-urls --output-file artifacts/release-inputs/licenses/licenses-python.json
          cp firmware/dependencies.lock artifacts/release-inputs/licenses/firmware-components.lock
      - name: Stage release inputs
        run: |
          set -euo pipefail
          FW_DIR="firmware/.pio/build/waveshare_esp32_c6_touch_amoled_1_64"
          mkdir -p artifacts/release-inputs/firmware
          find "$FW_DIR" -maxdepth 1 -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) -exec cp {} artifacts/release-inputs/firmware/ \;

          mkdir -p artifacts/release-inputs/hardware
          cp hardware/fabrication/rev-a0/agentping-carrier-gerbers.zip artifacts/release-inputs/hardware/
          cp hardware/fabrication/rev-a0/agentping-carrier-all-pos.csv artifacts/release-inputs/hardware/
          cp hardware/fabrication/rev-a0/agentping-carrier.ipc artifacts/release-inputs/hardware/
          cp hardware/reports/generated/erc.rpt artifacts/release-inputs/hardware/
          cp hardware/reports/generated/drc.rpt artifacts/release-inputs/hardware/
          cp hardware/bom/agentping-carrier-bom.csv artifacts/release-inputs/hardware/

          mkdir -p artifacts/release-inputs/docs
          cp docs/generated/protocol-v1-reference.md artifacts/release-inputs/docs/
          cp docs/release/mvp-release-runbook.md artifacts/release-inputs/docs/
          cp docs/release/security-privacy-review.md artifacts/release-inputs/docs/
          cp docs/release/dependency-license-inventory.md artifacts/release-inputs/docs/
          cp docs/release/rollback-recovery.md artifacts/release-inputs/docs/
          cp CHANGELOG.md artifacts/release-inputs/docs/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-inputs
          path: artifacts/release-inputs
          if-no-files-found: error

  windows-companion:
    name: Companion package (${{ matrix.rid }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.300
      - run: dotnet restore AgentPing.sln --locked-mode
      - run: dotnet test AgentPing.sln --configuration Release --no-restore
      - run: dotnet publish companion/AgentPing.Companion.Windows/AgentPing.Companion.Windows.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore --output artifacts/${{ matrix.rid }}/app
      - run: dotnet publish bridge/AgentPing.Bridge/AgentPing.Bridge.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore --output artifacts/${{ matrix.rid }}/app/bridge
      - run: Copy-Item docs/windows-troubleshooting.md artifacts/${{ matrix.rid }}/app/docs/windows-troubleshooting.md -Force
      - run: dotnet tool install --tool-path .tools wix --version 6.0.2
      - run: .tools/wix build companion/installer/AgentPing.wxs -arch ${{ matrix.rid == 'win-arm64' && 'arm64' || 'x64' }} -d PublishDir=artifacts/${{ matrix.rid }}/app -o artifacts/${{ matrix.rid }}/AgentPing-${{ matrix.rid }}-unsigned.msi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-companion-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error

  assemble-bundle:
    name: Assemble versioned release bundle
    runs-on: ubuntu-24.04
    needs: [verify-linux, windows-companion]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: release-linux-inputs
          path: artifacts/download/release-linux-inputs
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: release-companion-win-x64
          path: artifacts/download/release-companion-win-x64
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: release-companion-win-arm64
          path: artifacts/download/release-companion-win-arm64
      - id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.release_version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - id: bundle
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          OUT="artifacts/release/$VERSION"
          mkdir -p "$OUT"

          cp -R artifacts/download/release-linux-inputs "$OUT/linux-inputs"
          mkdir -p "$OUT/windows"
          cp -R artifacts/download/release-companion-win-x64 "$OUT/windows/win-x64"
          cp -R artifacts/download/release-companion-win-arm64 "$OUT/windows/win-arm64"

          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

          TARBALL="artifacts/release/agentping-${VERSION}-bundle.tar.gz"
          tar -czf "$TARBALL" -C artifacts/release "$VERSION"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentping-${{ steps.version.outputs.version }}-bundle
          path: |
            artifacts/release/${{ steps.version.outputs.version }}
            ${{ steps.bundle.outputs.tarball }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [assemble-bundle]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: agentping-${{ github.ref_name }}-bundle
          path: artifacts/release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          TARBALL="$(find artifacts/release -name 'agentping-*-bundle.tar.gz' -print -quit)"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$TARBALL" --clobber
          else
            gh release create "$VERSION" "$TARBALL" \
              --title "AgentPing $VERSION" \
              --notes-file docs/release/mvp-release-runbook.md \
              --verify-tag
          fi
